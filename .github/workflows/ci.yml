name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install SPA dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm ci
        working-directory: server

      - name: Prepare API database (SQLite)
        run: npm run setup --prefix server

      - name: Lint, test, build (SPA + policy smoke)
        run: npm run check
