name: Bug report
description: Something is broken or incorrect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Include enough detail that someone can reproduce without asking you follow-ups.

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Local (`npm run dev`)
        - Local SPA + API (`dev` + `dev:api`)
        - Vercel / Render demo
        - Other
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Log in as …
        2. Open …
        3. Click …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / console (optional)
      render: shell
