<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choir Person 360 — Revised template</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f0f8;color:#292333;font:16px/1.5 system-ui,sans-serif}main{max-width:760px;margin:32px auto;padding:0 18px 40px}header,section{background:white;border:1px solid #ddd5e8;border-radius:12px;margin:18px 0;padding:24px}header{border-top:9px solid #7047a3}h1{font-size:28px;line-height:1.2}h2{font-size:21px;margin:0 0 18px}label{display:block;margin:18px 0 8px}input:not([type=checkbox]),select{display:block;width:100%;border:1px solid #bfb5cc;border-radius:6px;padding:12px;font:inherit;background:white}button{border:0;border-radius:7px;padding:11px 17px;font:inherit;cursor:pointer;background:#7047a3;color:white}button.secondary{background:#f0eaf7;color:#583680}.checks label{display:flex;align-items:center;gap:12px;margin:10px 0}.checks input{width:19px;height:19px}.family{border-top:1px solid #ddd5e8;margin:24px 0;padding-top:18px}.family h3{margin:0}.muted{color:#6b6274;font-size:14px}#error{color:#a11}#family-add{margin-top:16px}[hidden]{display:none!important}.buttons{display:flex;gap:12px;flex-wrap:wrap}label:has(+ input[required])::after,label:has(+ select[required])::after{content:" *";color:#a11}</style>
<main><header><span class="muted">Choir template · Review</span><h1>Choir Person 360 registration</h1><div class="muted">Dates: DD-MM-YYYY</div></header><form id="registration"><div id="sections"></div><p id="error" role="alert"></p><div class="buttons"><button type="submit">Download import CSV</button><button type="reset" class="secondary">Clear</button></div></form></main>
<script>const CHOIR_V2=__CHOIR_SCHEMA__;
__CHOIR_RUNTIME__
const form=document.getElementById('registration'),sections=document.getElementById('sections');
const escapeHtml=value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const headings={BASICS:'About you',EMPLOYMENT:'Work',EDUCATION:'Education',CALLING:'Serving in the church',FAMILY:'Family',BAPTISM:'Baptism',MARRIAGE:'Marriage'};
function control(key,question,options,type='text',required=false){const id='field-'+key;return '<label for="'+id+'">'+escapeHtml(question)+'</label>'+(options?'<select id="'+id+'" name="'+key+'" '+(required?'required':'')+'><option value="">Choose…</option>'+options.map(option=>'<option value="'+escapeHtml(option)+'">'+escapeHtml(option)+'</option>').join('')+'</select>':'<input id="'+id+'" name="'+key+'" '+(required?'required':'')+' '+(type==='date'?'placeholder="DD-MM-YYYY" pattern="[0-9]{2}-[0-9]{2}-[0-9]{4}"':type==='number'?'type="number" min="1930" max="2100"':type==='email'?'type="email"':'type="text"')+'>');}
for(const key of Object.keys(headings)){const section=document.createElement('section');section.innerHTML='<h2>'+headings[key]+'</h2>';section.id='section-'+key;
  if(key==='CALLING'){section.innerHTML+='<p>How do you serve in the church?</p><div class="checks">'+CHOIR_V2.callings.concat(['Other']).map(role=>'<label><input type="checkbox" name="callings" value="'+escapeHtml(role)+'">'+role+'</label>').join('')+'</div><div id="other-role" hidden>'+control('otherCalling','What other role do you serve in?')+'</div>';}
  else if(key==='FAMILY'){section.innerHTML+='<div id="family-list"></div><button type="button" class="secondary" id="family-add">Add a family member</button>';}
  else for(const column of CHOIR_V2.columns.filter(column=>column.section===key)){const html=control(column.key,column.question,column.choices?.map(choice=>choice.label),column.type,!!column.required);section.innerHTML+=column.key==='MARRIAGE.endedOn'?'<div id="passing-date" hidden>'+html+'</div>':html;}
  sections.append(section);
}
function updateFamilyControls(){const cards=[...document.querySelectorAll('#family-list .family')];cards.forEach((card,index)=>card.querySelector('h3').textContent='Family member '+(index+1));const button=document.getElementById('family-add');button.disabled=cards.length>=CHOIR_V2.familyLimit;button.textContent=cards.length?'Add another family member':'Add a family member';}
document.getElementById('family-add').onclick=()=>{const used=[...document.querySelectorAll('#family-list .family')].map(card=>Number(card.dataset.index));const index=Array.from({length:CHOIR_V2.familyLimit},(_,position)=>position).find(position=>!used.includes(position));if(index===undefined)return;const card=document.createElement('div');card.className='family';card.dataset.index=String(index);card.innerHTML='<h3>Family member '+(index+1)+'</h3>'+control('family.'+index+'.relation','How is this person related to you?',CHOIR_V2.relations.map(row=>row.label),'text',true)+control('family.'+index+'.name','What is this family member’s full name?',null,'text',true)+control('family.'+index+'.dateOfBirth','What is this family member’s date of birth?',null,'date')+control('family.'+index+'.gender','What is this family member’s gender?',['Male','Female'])+control('family.'+index+'.phone','What is this family member’s phone number?')+control('family.'+index+'.nationalId','What is this family member’s National ID number?')+'<button type="button" class="secondary" style="margin-top:16px">Remove family member</button>';card.querySelector('button').onclick=()=>{card.remove();updateFamilyControls();};document.getElementById('family-list').append(card);updateFamilyControls();};
form.addEventListener('change',()=>{const other=form.querySelector('input[name="callings"][value="Other"]').checked;document.getElementById('other-role').hidden=!other;form.elements.otherCalling.required=other;const passing=form.elements['MARRIAGE.endedBy'].value==='Yes';document.getElementById('passing-date').hidden=!passing;form.elements['MARRIAGE.endedOn'].required=passing;if(!passing)form.elements['MARRIAGE.endedOn'].value='';});
form.addEventListener('submit',event=>{event.preventDefault();const data=new FormData(form),answers=Object.fromEntries(data);answers.callings=data.getAll('callings').filter(value=>value!=='Other');if(data.getAll('callings').includes('Other'))answers.callings.push(String(data.get('otherCalling')||'').trim());try{const csv=choirReviewCsv_([answers]);const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const link=document.createElement('a');link.href=url;link.download='choir-person-360.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),5000);document.getElementById('error').textContent='';}catch(error){document.getElementById('error').textContent=error.message;}});
form.addEventListener('reset',()=>{document.getElementById('family-list').replaceChildren();updateFamilyControls();document.getElementById('other-role').hidden=true;document.getElementById('passing-date').hidden=true;document.getElementById('error').textContent='';setTimeout(()=>{form.elements.otherCalling.required=false;form.elements['MARRIAGE.endedOn'].required=false;});});
</script></html>
